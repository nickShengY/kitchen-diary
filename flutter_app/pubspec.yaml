name: kitchen_diary
description: A sophisticated recipe and cooking community app with AI-powered features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  google_sign_in: ^6.2.1
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # UI/UX
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_spinkit: ^5.2.0
  lottie: ^3.0.0
  glassmorphism: ^3.0.0
  animated_text_kit: ^4.2.2
  confetti: ^0.7.0
  
  # Icons
  iconsax: ^0.0.8
  flutter_svg: ^2.0.9
  
  # Navigation
  go_router: ^13.0.1
  
  # Image Handling
  image_picker: ^1.0.7
  image_cropper: ^8.0.0
  photo_view: ^0.14.0
  
  # Camera & ML
  camera: ^0.10.5+9
  google_generative_ai: ^0.2.2
  
  # Payments / Subscriptions
  purchases_flutter: ^6.17.1
  in_app_purchase: ^3.1.13
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  http: ^1.1.2
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  
  # Animations
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.11
  rive: ^0.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/kitchen_data.json
    - assets/kitchen_images/
  
  # Assets - uncomment when files are added
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
  #   - assets/fonts/
  
  # Fonts - uncomment when Poppins fonts are downloaded
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
